server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

spring:
  application:
    name: transaction-service
  datasource:
    url: ${TRANSACTION_DB_URL:jdbc:postgresql://localhost:5432/finledger?currentSchema=transaction}
    username: ${TRANSACTION_DB_USERNAME:arun}
    password: ${TRANSACTION_DB_PASSWORD:1212}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
  sql:
    init:
      mode: never
  flyway:
    table: transaction_flyway_history
    schemas: transaction
    default-schema: transaction
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

account-service:
  url: ${ACCOUNT_SERVICE_URL:http://localhost:8081}

outbox:
  publisher:
    delay-ms: ${OUTBOX_PUBLISHER_DELAY_MS:5000}

transfer:
  recovery:
    delay-ms: ${TRANSFER_RECOVERY_DELAY_MS:10000}

security:
  jwt:
    secret: ${JWT_SECRET:finledger-development-jwt-secret-change-this-value-32}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
