services:
  postgres:
    image: postgres:16
    container_name: finledger-postgres
    environment:
      POSTGRES_DB: finledger
      POSTGRES_USER: ${POSTGRES_USER:-finledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finledger-dev-password}
    ports:
      - "5432:5432"
    volumes:
      - finledger-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: finledger-mongo
    ports:
      - "27017:27017"
    volumes:
      - finledger-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.0.0
    container_name: finledger-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - finledger-kafka-data:/bitnami/kafka

  account-service:
    build:
      context: .
      dockerfile: account-service/Dockerfile
    environment:
      ACCOUNT_DB_URL: jdbc:postgresql://postgres:5432/finledger?currentSchema=account
      ACCOUNT_DB_USERNAME: ${POSTGRES_USER:-finledger}
      ACCOUNT_DB_PASSWORD: ${POSTGRES_PASSWORD:-finledger-dev-password}
      JWT_SECRET: ${JWT_SECRET:-finledger-development-jwt-secret-change-this-value-32}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  transaction-service:
    build:
      context: .
      dockerfile: transaction-service/Dockerfile
    environment:
      TRANSACTION_DB_URL: jdbc:postgresql://postgres:5432/finledger?currentSchema=transaction
      TRANSACTION_DB_USERNAME: ${POSTGRES_USER:-finledger}
      TRANSACTION_DB_PASSWORD: ${POSTGRES_PASSWORD:-finledger-dev-password}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ACCOUNT_SERVICE_URL: http://account-service:8081
      JWT_SECRET: ${JWT_SECRET:-finledger-development-jwt-secret-change-this-value-32}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      account-service:
        condition: service_started

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    environment:
      MONGO_URI: mongodb://mongo:27017/finledger_notifications
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-finledger-development-jwt-secret-change-this-value-32}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
    ports:
      - "8083:8083"
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_started

volumes:
  finledger-postgres-data:
  finledger-mongo-data:
  finledger-kafka-data:
